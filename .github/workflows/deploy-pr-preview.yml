name: Deploy PR preview

# Not fully manual anymore: a maintainer can still run this from the Actions
# tab (or `gh workflow run`), but the common path now is a `/prpreview` (or
# `/prpreview remove`) comment on the PR itself — see the `determine` job's
# `if` for how that's gated. It never fires on its own on every push — that's
# what deploy-web.yml does for main. The `pull_request: closed` trigger below
# is the one fully-automatic case: it cleans up the preview so gh-pages
# doesn't accumulate a directory per PR forever.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to preview'
        required: true
        # string, not number: workflow_dispatch's `number` type is a float
        # under the hood, and GitHub serializes it into expressions as
        # "133.0" rather than "133" — which broke refs/pull/<n>/head lookups.
        # pr_number is only ever used as text here (ref paths, directory
        # names, comment strings), so there's no reason to risk that.
        type: string
      action:
        description: 'Deploy the preview, or take down a previously deployed one'
        required: false
        type: choice
        options: [deploy, remove]
        default: deploy
  pull_request:
    types: [closed]
  # issue_comment fires for comments on both issues and PRs (GitHub models a
  # PR's conversation tab as an "issue" under the hood). The `determine` job
  # below filters this down to PR comments containing /prpreview.
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  # Three trigger shapes land here: workflow_dispatch inputs, the
  # pull_request:closed event payload (always "remove"), and an issue_comment
  # event carrying a /prpreview or /prpreview remove command. This job
  # normalizes all three into one pr_number/action output pair so the deploy
  # and remove jobs below don't need to know which trigger fired.
  determine:
    runs-on: ubuntu-latest
    # issue_comment fires for every comment on every issue and PR in the
    # repo, so this must actively opt in rather than just ignore the noise:
    # only a comment on a PR (not a plain issue), from someone with write
    # access to the repo (checkout below runs the PR head's code — including
    # forked contributions — with a GITHUB_TOKEN that can push to gh-pages,
    # so this can't be left open to arbitrary commenters), whose body starts
    # with /prpreview. Any other issue_comment is a silent no-op: the job
    # still "runs" but this `if` is false, so nothing downstream fires.
    if: |
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.pull_request != null &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        startsWith(github.event.comment.body, '/prpreview')
      )
    outputs:
      pr_number: ${{ steps.set.outputs.pr_number }}
      action: ${{ steps.set.outputs.action }}
    steps:
      - id: set
        # COMMENT_BODY goes through env rather than being interpolated
        # straight into the script below — the comment body is
        # attacker-influenceable text, and inlining it as `${{ ... }}`
        # inside a `run:` block is a known script-injection vector (a body
        # containing backticks or `$(...)` would execute inside the shell).
        # Routing it through env keeps it as inert data.
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "action=remove" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "pr_number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            # Strip the /prpreview prefix and whitespace; anything other than
            # a bare "remove" left over defaults to "deploy" (covers plain
            # "/prpreview" and the explicit "/prpreview deploy").
            arg=$(printf '%s' "$COMMENT_BODY" | sed -E 's#^/prpreview[[:space:]]*##i' | tr -d '[:space:]')
            if [ "$arg" = "remove" ]; then
              echo "action=remove" >> "$GITHUB_OUTPUT"
            else
              echo "action=deploy" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "pr_number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
            echo "action=${{ inputs.action }}" >> "$GITHUB_OUTPUT"
          fi

      # Only reached when the `if` above accepted the command — gives the
      # commenter visible confirmation that it was picked up, distinct from
      # the silent ignore a stray or unauthorized comment gets.
      - name: React to the triggering comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

  deploy:
    needs: determine
    if: needs.determine.outputs.action == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          # refs/pull/<n>/head exists on the base repo for PRs from forks too,
          # so this works without needing the contributor's branch directly.
          ref: refs/pull/${{ needs.determine.outputs.pr_number }}/head

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web export
        run: npm run build:web

      # webpack.config.js already emits relative asset paths in production
      # (see its comment on `publicPath`), which is exactly what's needed to
      # serve correctly from this nested pr-preview/pr-<n>/ path.
      - name: Publish preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
          destination_dir: pr-preview/pr-${{ needs.determine.outputs.pr_number }}
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Comment preview URL on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const prNumber = ${{ needs.determine.outputs.pr_number }};
            const url = `https://${owner}.github.io/${repo}/pr-preview/pr-${prNumber}/`;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: `Preview deployed: ${url}\n\nComment \`/prpreview\` again to rebuild it, or \`/prpreview remove\` to take it down early — it's also removed automatically once this PR closes.`,
            });

  remove:
    needs: determine
    if: needs.determine.outputs.action == 'remove'
    runs-on: ubuntu-latest
    steps:
      # gh-pages won't exist yet if this fires before deploy-web.yml or this
      # workflow's `deploy` job has ever run (e.g. a PR opened and closed
      # before the first-ever Pages deploy) — skip rather than fail.
      - name: Check gh-pages branch exists
        id: check
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}.git" gh-pages >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout gh-pages
        if: steps.check.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove preview directory
        if: steps.check.outputs.exists == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          rm -rf "pr-preview/pr-${{ needs.determine.outputs.pr_number }}"
          git add -A
          if git diff --cached --quiet; then
            echo "No preview directory for PR #${{ needs.determine.outputs.pr_number }} — nothing to remove."
          else
            git commit -m "Remove PR preview for #${{ needs.determine.outputs.pr_number }}"
            git push
          fi
