name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

# Pushes to gh-pages must be serialized — two concurrent runs racing to commit
# would fight over the branch. Previews (deploy-pr-preview.yml) use their own
# per-PR group so they don't queue behind this one.
concurrency:
  group: gh-pages-main
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web export
        run: npm run build:web

      # Publishes to the gh-pages branch root rather than actions/deploy-pages,
      # because deploy-pages replaces the whole Pages deployment on every run —
      # there is no way for a second, PR-scoped deploy to coexist with it. A
      # branch keeps main's output and each PR preview's output as separate
      # directories on the same branch (see deploy-pr-preview.yml).
      # `keep_files: true` is what makes that coexistence work: without it this
      # step would delete every pr-preview/ directory on each push to main.
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
