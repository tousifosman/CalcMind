<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 570" width="1660" height="570" role="img" aria-label="Anatomy of a CalcMind formula chain, labelling number, operator, equals and result nodes">
  <title>CalcMind node anatomy</title>
  <desc>The same formula as the visual reference, annotated with the node kind of each cell and
  the snap boundaries between cells.</desc>

  <defs>
    <clipPath id="aOuter"><rect x="0" y="0" width="1505" height="277" rx="12" ry="12"/></clipPath>
    <clipPath id="aInner"><rect x="11" y="11" width="1483" height="256" rx="6" ry="6"/></clipPath>
    <pattern id="aTexture" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#FF7E79"/>
      <rect x="1" y="0" width="1" height="1" fill="#FFD1CF"/>
      <rect x="3" y="2" width="1" height="1" fill="#FFD1CF"/>
    </pattern>
  </defs>

  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" fill="#3B4252">
    <!-- callout labels -->
    <text x="1396" y="60"  text-anchor="middle" font-weight="700">result node</text>
    <text x="1396" y="96"  text-anchor="middle" fill="#6B7280">derived · read-only · dot texture</text>
    <text x="507"  y="130" text-anchor="middle" font-weight="700">operator node</text>
    <text x="258"  y="176" text-anchor="middle" font-weight="700">number node</text>
    <text x="1137" y="176" text-anchor="middle" font-weight="700">equals node</text>
  </g>

  <!-- leader lines from each label down to the chain -->
  <g stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6 5" fill="none">
    <path d="M1396 108 V190"/>
    <path d="M507 142 V190"/>
    <path d="M258 188 V190"/>
    <path d="M1137 188 V190"/>
  </g>

  <!-- the chain itself, identical geometry to formula-reference.svg -->
  <g transform="translate(78 190)">
    <g clip-path="url(#aOuter)">
      <rect x="0"    y="0" width="361" height="277" fill="#8CE0D2"/>
      <rect x="361"  y="0" width="136" height="277" fill="#FFD78E"/>
      <rect x="497"  y="0" width="136" height="277" fill="#8CE0D2"/>
      <rect x="633"  y="0" width="136" height="277" fill="#FFD78E"/>
      <rect x="769"  y="0" width="220" height="277" fill="#8CE0D2"/>
      <rect x="989"  y="0" width="140" height="277" fill="#AA557F"/>
      <rect x="1129" y="0" width="376" height="277" fill="#FFA3A0"/>
    </g>
    <g clip-path="url(#aInner)">
      <rect x="11"   y="11" width="350" height="256" fill="#44BDAD"/>
      <rect x="361"  y="11" width="136" height="256" fill="#FFBF28"/>
      <rect x="497"  y="11" width="136" height="256" fill="#44BDAD"/>
      <rect x="633"  y="11" width="136" height="256" fill="#FFBF28"/>
      <rect x="769"  y="11" width="220" height="256" fill="#44BDAD"/>
      <rect x="989"  y="11" width="140" height="256" fill="#7030A0"/>
      <rect x="1129" y="11" width="365" height="256" fill="url(#aTexture)"/>
    </g>
    <g fill="#FFFFFF" font-family="Montserrat, 'Trebuchet MS', 'Helvetica Neue', Arial, sans-serif"
       font-weight="800" font-size="127" text-anchor="middle">
      <text x="180"  y="191">1221</text>
      <text x="565"  y="191">3</text>
      <text x="881"  y="191">20</text>
      <text x="1318" y="191">1204</text>
    </g>
    <g fill="#FFFFFF">
      <rect x="399" y="148" width="60" height="14"/>
      <rect x="422" y="125" width="14" height="60"/>
      <rect x="684" y="148.5" width="34" height="13"/>
      <rect x="1029" y="135.5" width="60" height="13"/>
      <rect x="1029" y="161.5" width="60" height="13"/>
    </g>
  </g>

  <!-- snap boundary ticks, one per cell edge -->
  <g stroke="#9CA3AF" stroke-width="2">
    <path d="M89 477 V500"/>
    <path d="M439 477 V500"/>
    <path d="M575 477 V500"/>
    <path d="M711 477 V500"/>
    <path d="M847 477 V500"/>
    <path d="M1067 477 V500"/>
    <path d="M1207 477 V500"/>
    <path d="M1572 477 V500"/>
  </g>
  <g stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6 5">
    <path d="M89 500 H1572"/>
  </g>
  <text x="830" y="545" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#6B7280">
    cells sit flush, so a snapped chain reads as one object — every edge is a snap and insertion point
  </text>
</svg>
